<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume Analyzer — วิเคราะห์เรซูเม่</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0F1720;
    --ink-raised: #161F2B;
    --paper: #E7E5DE;
    --paper-dim: #A7ACB6;
    --signal: #4F7CFF;
    --signal-dim: #2C3E63;
    --mint: #3ECF8E;
    --amber: #F2A93B;
    --hair: #26313F;
    --radius: 10px;
    --font-display: "IBM Plex Mono", monospace;
    --font-body: "IBM Plex Sans Thai", "IBM Plex Sans", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    background-image:
      linear-gradient(var(--hair) 1px, transparent 1px),
      linear-gradient(90deg, var(--hair) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--hair);
    padding-bottom: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.15);
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 1.6vw, 1.35rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: #fff;
  }

  .position-tag {
    font-family: var(--font-display);
    font-size: 0.78rem;
    color: var(--paper-dim);
    border: 1px solid var(--hair);
    border-radius: 100px;
    padding: 6px 14px;
    letter-spacing: 0.02em;
  }

  .position-tag b { color: var(--signal); font-weight: 500; }

  /* --- Dropzone --- */
  .dropzone {
    border: 1.5px dashed var(--hair);
    border-radius: var(--radius);
    background: var(--ink-raised);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }

  .dropzone:hover,
  .dropzone:focus-visible {
    border-color: var(--signal);
    background: #17202D;
  }

  .dropzone.drag-over {
    border-color: var(--signal);
    background: #182236;
  }

  .dropzone:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 3px;
  }

  .dz-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 14px;
    color: var(--signal);
  }

  .dz-title {
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
    margin-bottom: 4px;
  }

  .dz-sub {
    font-size: 0.85rem;
    color: var(--paper-dim);
  }

  .dz-filename {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-size: 0.82rem;
    color: var(--mint);
    background: rgba(62, 207, 142, 0.08);
    border: 1px solid rgba(62, 207, 142, 0.25);
    padding: 6px 12px;
    border-radius: 100px;
  }

  input[type="file"] { display: none; }

  .actions {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  button.primary {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink);
    background: var(--signal);
    border: none;
    border-radius: var(--radius);
    padding: 13px 28px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
  }

  button.primary:hover:not(:disabled) { background: #6690FF; }
  button.primary:active:not(:disabled) { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  /* --- Status / errors --- */
  .status-line {
    display: none;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    font-family: var(--font-display);
    font-size: 0.82rem;
    color: var(--paper-dim);
  }
  .status-line.visible { display: flex; }

  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--hair);
    border-top-color: var(--signal);
    animation: spin 0.7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    margin-top: 18px;
    border: 1px solid rgba(242, 169, 59, 0.4);
    background: rgba(242, 169, 59, 0.08);
    color: #FFD599;
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 0.86rem;
    line-height: 1.5;
  }
  .error-box.visible { display: block; }

  /* --- Results --- */
  #results {
    display: none;
    margin-top: 48px;
  }
  #results.visible { display: block; }

  .scorecard {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 32px;
    align-items: center;
    background: var(--ink-raised);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 28px;
  }

  @media (max-width: 620px) {
    .scorecard { grid-template-columns: 1fr; text-align: center; }
    .gauge-wrap { margin: 0 auto; }
  }

  .gauge-wrap { position: relative; width: 172px; height: 172px; }

  .gauge-value {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gauge-number {
    font-family: var(--font-display);
    font-size: 2.3rem;
    font-weight: 600;
    color: #fff;
    line-height: 1;
  }

  .gauge-label {
    font-family: var(--font-display);
    font-size: 0.66rem;
    color: var(--paper-dim);
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  .score-meta .lang-tag {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 0.72rem;
    color: var(--signal);
    border: 1px solid var(--signal-dim);
    border-radius: 100px;
    padding: 3px 10px;
    margin-bottom: 10px;
  }

  .recommendation {
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    margin: 0 0 8px;
  }

  .recommendation-detail {
    font-size: 0.88rem;
    color: var(--paper-dim);
    line-height: 1.6;
    margin: 0;
  }

  /* --- Criteria bars --- */
  .criteria {
    background: var(--ink-raised);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 28px;
  }

  .section-eyebrow {
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--paper-dim);
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .criterion { margin-bottom: 20px; }
  .criterion:last-child { margin-bottom: 0; }

  .criterion-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .criterion-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
  }

  .criterion-score {
    font-family: var(--font-display);
    font-size: 0.85rem;
    color: var(--signal);
  }

  .bar-track {
    height: 6px;
    background: var(--hair);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--signal-dim), var(--signal));
    border-radius: 100px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
  }

  .criterion-reason {
    font-size: 0.84rem;
    color: var(--paper-dim);
    line-height: 1.6;
    margin: 0;
  }

  /* --- Strengths / gaps --- */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 620px) {
    .two-col { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--ink-raised);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 24px;
  }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    margin: 0 0 14px;
  }

  .panel-title.mint { color: var(--mint); }
  .panel-title.amber { color: var(--amber); }

  .panel ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .panel li {
    font-size: 0.86rem;
    color: var(--paper);
    line-height: 1.6;
    padding: 8px 0;
    border-top: 1px solid var(--hair);
  }
  .panel li:first-child { border-top: none; padding-top: 0; }

  .download-row {
    display: flex;
    justify-content: center;
    margin-top: 24px;
  }

  button.secondary {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 0.82rem;
    color: var(--paper-dim);
    background: transparent;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 10px 20px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  button.secondary:hover {
    border-color: var(--signal);
    color: var(--signal);
  }

  button.secondary:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 3px;
  }
  footer {
    text-align: center;
    margin-top: 56px;
    font-family: var(--font-display);
    font-size: 0.72rem;
    color: var(--paper-dim);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>RESUME ANALYZER</h1>
      </div>
      <div class="position-tag">ตำแหน่ง <b id="positionName">AI &amp; Data Solution</b></div>
    </header>

    <form id="uploadForm">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="เลือกไฟล์เรซูเม่ PDF">
        <svg class="dz-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M20 6v20M20 6l-7 7M20 6l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 28v4a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="dz-title">ลากไฟล์ PDF มาวางที่นี่</div>
        <div class="dz-sub">หรือคลิกเพื่อเลือกไฟล์ — รองรับเฉพาะ .pdf</div>
        <div id="filenameTag" class="dz-filename" style="display:none;">
          <span id="filenameText"></span>
        </div>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" />
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="submitBtn" disabled>วิเคราะห์เรซูเม่</button>
      </div>

      <div class="status-line" id="statusLine">
        <span class="spinner" aria-hidden="true"></span>
        <span id="statusText">กำลังวิเคราะห์...</span>
      </div>

      <div class="error-box" id="errorBox" role="alert"></div>
    </form>

    <section id="results" aria-live="polite">
      <div class="scorecard">
        <div class="gauge-wrap">
          <svg viewBox="0 0 172 172" width="172" height="172" aria-hidden="true">
            <circle cx="86" cy="86" r="76" fill="none" stroke="#26313F" stroke-width="10" />
            <circle id="gaugeArc" cx="86" cy="86" r="76" fill="none" stroke="#4F7CFF" stroke-width="10"
              stroke-linecap="round" transform="rotate(-90 86 86)"
              stroke-dasharray="477.5" stroke-dashoffset="477.5" />
          </svg>
          <div class="gauge-value">
            <span class="gauge-number" id="overallScore">0</span>
            <span class="gauge-label">OVERALL / 100</span>
          </div>
        </div>
        <div class="score-meta">
          <span class="lang-tag" id="langTag">TH</span>
          <p class="recommendation" id="recommendationTitle">—</p>
          <p class="recommendation-detail" id="recommendationDetail"></p>
        </div>
      </div>

      <div class="criteria">
        <p class="section-eyebrow">รายละเอียดคะแนนตามเกณฑ์</p>
        <div id="criteriaList"></div>
      </div>

      <div class="two-col">
        <div class="panel">
          <p class="panel-title mint">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7.5l3.2 3.5L12 3" stroke="#3ECF8E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            จุดแข็ง
          </p>
          <ul id="strengthsList"></ul>
        </div>
        <div class="panel">
          <p class="panel-title amber">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 4v4M7 10h.01" stroke="#F2A93B" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="7" r="6" stroke="#F2A93B" stroke-width="1.3"/></svg>
            ช่องว่างที่ควรพัฒนา
          </p>
          <ul id="gapsList"></ul>
        </div>
      </div>
    </section>
    </section>

    <footer>Resume · JD Matching Engine </footer>

  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const filenameTag = document.getElementById('filenameTag');
    const filenameText = document.getElementById('filenameText');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');
    const statusLine = document.getElementById('statusLine');
    const statusText = document.getElementById('statusText');
    const errorBox = document.getElementById('errorBox');
    const results = document.getElementById('results');

    let selectedFile = null;

    function setFile(file) {
      if (!file) return;
      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        showError('รองรับเฉพาะไฟล์ PDF เท่านั้น กรุณาเลือกไฟล์ .pdf');
        return;
      }
      selectedFile = file;
      filenameText.textContent = file.name;
      filenameTag.style.display = 'inline-flex';
      submitBtn.disabled = false;
      hideError();
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
      });
    });
    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      setFile(file);
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }
    function hideError() {
      errorBox.classList.remove('visible');
      errorBox.textContent = '';
    }

    function setLoading(isLoading, label) {
      submitBtn.disabled = isLoading;
      statusLine.classList.toggle('visible', isLoading);
      if (label) statusText.textContent = label;
    }

    const CRITERIA_LABELS = {
      education_experience: 'ประสบการณ์ & การศึกษา',
      skills: 'ทักษะ',
      knowledge: 'ความรู้',
      tools: 'เครื่องมือ',
    };

    function renderResults(data) {
      lastResult = data;
      const overall = Math.round(data.overall_score ?? 0);
      document.getElementById('overallScore').textContent = overall;
      document.getElementById('langTag').textContent =
        (data.resume_language || '').toUpperCase() === 'EN' ? 'EN RESUME' : 'TH RESUME';
      document.getElementById('recommendationTitle').textContent = data.recommendation || '—';
      document.getElementById('positionName').textContent = data.position || 'AI & Data Solution Intern';

      const circumference = 2 * Math.PI * 76;
      const arc = document.getElementById('gaugeArc');
      arc.style.strokeDasharray = circumference;
      arc.style.transition = 'stroke-dashoffset 1s cubic-bezier(0.16,1,0.3,1)';
      requestAnimationFrame(() => {
        const offset = circumference - (Math.max(0, Math.min(100, overall)) / 100) * circumference;
        arc.style.strokeDashoffset = offset;
      });

      const criteriaList = document.getElementById('criteriaList');
      criteriaList.innerHTML = '';
      const scores = data.criteria_scores || {};
      Object.keys(CRITERIA_LABELS).forEach((key, i) => {
        const c = scores[key];
        if (!c) return;
        const score = Math.round(c.score ?? 0);
        const el = document.createElement('div');
        el.className = 'criterion';
        el.innerHTML = `
          <div class="criterion-head">
            <span class="criterion-name">${CRITERIA_LABELS[key]}</span>
            <span class="criterion-score">${score}/100</span>
          </div>
          <div class="bar-track"><div class="bar-fill" data-target="${score}"></div></div>
          <p class="criterion-reason">${c.reasoning || ''}</p>
        `;
        criteriaList.appendChild(el);
        setTimeout(() => {
          el.querySelector('.bar-fill').style.width = score + '%';
        }, 60 * i);
      });

      const strengthsList = document.getElementById('strengthsList');
      strengthsList.innerHTML = '';
      (data.strengths || []).forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        strengthsList.appendChild(li);
      });

      const gapsList = document.getElementById('gapsList');
      gapsList.innerHTML = '';
      (data.gaps || []).forEach(g => {
        const li = document.createElement('li');
        li.textContent = g;
        gapsList.appendChild(li);
      });

      document.getElementById('recommendationDetail').textContent =
        `วิเคราะห์จากเนื้อหาเรซูเม่เทียบกับ ${data.position || 'ตำแหน่งที่กำหนด'} ครบทั้ง 4 ด้าน`;

      results.classList.add('visible');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedFile) return;

      hideError();
      results.classList.remove('visible');
      setLoading(true, 'กำลังอ่านไฟล์และวิเคราะห์...');

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/analyze-resume', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || `เกิดข้อผิดพลาด (HTTP ${res.status})`);
        }

        renderResults(data);
      } catch (err) {
        showError(err.message || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ กรุณาลองใหม่อีกครั้ง');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
